<!DOCTYPE html>
<html lang="nl" prefix="ai: https://geocentrum.local/ns/ai# acl: http://www.w3.org/ns/auth/acl#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX OS // Tijdscapsule & RDF SPARQL Explorer</title>
    <style>
        :root {
            --bg-dark: #060a0d;
            --bg-panel: #0b1116;
            --bg-card: #101820;
            --border: #1d2b36;
            --emerald: #10b981;
            --amber: #f59e0b;
            --cyan: #06b6d4;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--mono);
            font-size: 13px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 100vh;
        }

        header {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { color: var(--emerald); font-size: 15px; display: flex; align-items: center; gap: 8px; }
        
        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--emerald);
            background: rgba(16, 185, 129, 0.12);
            color: var(--emerald);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .pane {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        textarea, select, input {
            background: #040709;
            color: var(--emerald);
            border: 1px solid var(--border);
            padding: 8px 10px;
            font-family: var(--mono);
            font-size: 12px;
            border-radius: 4px;
            outline: none;
            width: 100%;
        }

        button {
            background: var(--emerald);
            color: #040709;
            border: none;
            padding: 8px 14px;
            font-family: var(--mono);
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        button.sec {
            background: transparent;
            color: var(--amber);
            border: 1px solid var(--amber);
        }

        .timeline-list {
            background: #040709;
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 320px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timeline-item {
            background: #0d1318;
            border: 1px solid var(--border);
            border-left: 3px solid var(--emerald);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .timeline-item:hover {
            border-color: var(--emerald);
        }

        .timeline-time {
            font-size: 10px;
            color: var(--amber);
            margin-bottom: 4px;
        }

        .sparql-results {
            background: #040709;
            border: 1px dashed var(--amber);
            border-radius: 4px;
            padding: 10px;
            color: #fde68a;
            font-size: 11px;
            white-space: pre-wrap;
            overflow-x: auto;
            flex: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span>⏳ Tijdscapsule // Pod RDF & SPARQL Explorer</span>
            <span class="badge">Opslag: /pod/ai-logs/analyse.ttl</span>
        </h1>
        <button onclick="laadTijdscapsuleLogboek()">↻ Herlaad Tijdscapsule</button>
    </header>

    <div class="workspace">
        <div class="pane">
            <div class="pane-header">
                <span>1. Historische Systeemstaten & AI Analyses</span>
                <span>Tijdscapsule Index</span>
            </div>
            <div class="pane-body">
                <label style="color:var(--text-muted); font-size:11px;">Filter op trefwoord of dataset:</label>
                <input type="text" id="filter-input" placeholder="Bijv. Scherpenisse, Warmenhoven of Planimeter..." oninput="filterTijdlijn()">

                <div class="timeline-list" id="timeline-container"></div>
            </div>
        </div>

        <div class="pane">
            <div class="pane-header">
                <span>2. Lokale SPARQL Query Console</span>
                <span>Semantic Graph Search</span>
            </div>
            <div class="pane-body" style="height: 100%;">
                <label style="color:var(--text-muted); font-size:11px;">SPARQL Query op /pod/ai-logs/:</label>
                <textarea id="sparql-query" rows="5" spellcheck="false">SELECT ?analyse ?bron ?conclusie WHERE {
  ?analyse a ai:SolidPodRAGResult ;
           ai:bronBestand ?bron ;
           ai:conclusie ?conclusie .
}</textarea>
                
                <div style="display:flex; gap:8px;">
                    <button onclick="voerSparqlUit()">▶ Voer SPARQL Query Uit</button>
                    <button class="sec" onclick="document.getElementById('sparql-results').textContent='// Resultaten wachten op query...'">Reset</button>
                </div>

                <label style="color:var(--text-muted); font-size:11px; margin-top:4px;">Resultaten (JSON / RDF Graaf):</label>
                <div class="sparql-results" id="sparql-results">// Voer een query uit om de analyse-triples te doorzoeken...</div>
            </div>
        </div>
    </div>

    <script>
        let TIJDSCAPSULE_DB = [
            {
                id: "analyse-1793048526734",
                timestamp: "2026-10-26T21:02:06.734Z",
                bron: "/pod/osint/warmenhoven-php2shell.ttl",
                engine: "Ollama Mistral (127.0.0.1:11434)",
                vraag: "Wat houdt het dossier Adrianus Warmenhoven en de php2shell CVE in?",
                conclusie: "OSINT & CVE-Analyse: Adrianus Warmenhoven duidt de risico's in moderne infrastructuren. Voor de php2shell kwetsbaarheid (CVE-2026-109618 / CVE-2026-109619) geldt dat publieke AI-gegenereerde PoCs falen doordat de benodigde PHP heap-manipulatie ontbreekt in de praktijk."
            },
            {
                id: "analyse-1793049112890",
                timestamp: "2026-10-26T21:11:52.890Z",
                bron: "/pod/kadaster/scherpenisse-e108-e1552.ttl",
                engine: "Ollama Mistral (127.0.0.1:11434)",
                vraag: "Analyseer perceel Scherpenisse E 108 -> E 1552 en valideer de kadastrale keten.",
                conclusie: "Kadastrale Verificatie: Perceel Scherpenisse Sectie E 108 is juridisch omgezet naar Sectie E 1552 / E 1551 (Platteweg 3-5-7). Oppervlakte en coördinaten zijn geverifieerd binnen de soevereine Solid datakluis onder beheer van WebID card.ttl#me."
            },
            {
                id: "analyse-1793049615684",
                timestamp: "2026-10-26T21:20:15.684Z",
                bron: "/pod/rekencentrum/ott-planimeter-573.ttl",
                engine: "Ollama Mistral (127.0.0.1:11434)",
                vraag: "Beschrijf de werking van de A. Ott Planimeter Nr. 573 in het Rekencentrum.",
                conclusie: "Rekencentrum Verificatie: De A. Ott Compensatie Polaire Planimeter (Nr. 573) berekent oppervlaktes mechanisch met nonius-compensatie, gekoppeld aan Saemundsson-refractie en beveiligd met FinalCrypt OTP."
            }
        ];

        function laadTijdscapsuleLogboek() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            TIJDSCAPSULE_DB.forEach(item => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `
                    <div class="timeline-time">🕒 ${item.timestamp} | ⚙️ ${item.engine}</div>
                    <div style="font-weight:bold; color:var(--emerald); margin-bottom:2px;">📁 ${item.bron}</div>
                    <div style="font-size:11px; color:#cbd5e1; margin-bottom:4px;"><b>Vraag:</b> ${item.vraag}</div>
                    <div style="font-size:11px; color:#94a3b8;"><b>Conclusie:</b> ${item.conclusie.substring(0, 110)}...</div>
                `;
                div.onclick = () => {
                    document.getElementById('sparql-results').textContent = JSON.stringify(item, null, 2);
                };
                container.appendChild(div);
            });
        }

        function filterTijdlijn() {
            const query = document.getElementById('filter-input').value.toLowerCase();
            const items = document.querySelectorAll('.timeline-item');
            TIJDSCAPSULE_DB.forEach((item, index) => {
                const match = item.bron.toLowerCase().includes(query) || 
                              item.conclusie.toLowerCase().includes(query) || 
                              item.vraag.toLowerCase().includes(query);
                items[index].style.display = match ? 'block' : 'none';
            });
        }

        function voerSparqlUit() {
            const resultsBox = document.getElementById('sparql-results');
            resultsBox.textContent = `[SPARQL Engine] Uitvoeren op gekoppelde Solid Pod graaf...\n\n` + 
                JSON.stringify(TIJDSCAPSULE_DB.map(i => ({
                    analyse: `https://geocentrum.local/ns/ai#${i.id}`,
                    bronBestand: i.bron,
                    inferentieEngine: i.engine,
                    conclusie: i.conclusie
                })), null, 2);
        }

        laadTijdscapsuleLogboek();
    </script>
</body>
</html>
