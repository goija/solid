    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOPBAR */
    .topbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .theme-group, .scale-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .status-banner {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent-2);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent-2);
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    /* NAV CENTRA */
    .centra-nav {
      background: var(--bg-vp-header);
      border-bottom: 1px solid var(--border);
      padding: 6px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .nav-btn, .btn {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .nav-btn:hover, .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .nav-btn.active, .btn.active {
      background: var(--accent);
      color: #05080f;
      border-color: var(--accent);
      font-weight: 700;
    }
    .btn-green {
      background: var(--accent-2);
      color: #04130d;
      border-color: var(--accent-2);
      font-weight: 700;
    }

    /* VIEWPORT FLOOR */
    #viewport-floor {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      transform-origin: top left;
      flex: 1;
    }
    .viewport {
      background: var(--bg-vp);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      min-height: 360px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.28);
    }
    .vp-s  { grid-column: span 4; }
    .vp-m  { grid-column: span 6; }
    .vp-l  { grid-column: span 8; }
    .vp-xl { grid-column: span 12; }
    @media (max-width: 1100px) {
      .vp-s, .vp-m, .vp-l { grid-column: span 12; }
    }

    .vp-header {
      background: var(--bg-vp-header);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      user-select: none;
    }
    .vp-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vp-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .vp-ctrl-btn {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .vp-ctrl-btn:hover, .vp-ctrl-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .vp-canvas {
      flex: 1;
      overflow: auto;
      position: relative;
      padding: 10px;
    }
    .vp-stage {
      transform-origin: 0 0;
      transition: transform 0.06s linear;
      min-height: 100%;
    }
    .vp-resize-handle {
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      color: var(--text-muted);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      z-index: 10;
    }

      height: 410px;
